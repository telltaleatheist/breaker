<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Breaker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Breaker</span>
      </div>
      <div id="connection" class="connection"></div>
    </header>

    <div id="banner" class="banner hidden"></div>

    <section class="durations-row">
      <span class="durations-label">Reset after</span>
      <div id="durations" class="durations" role="group" aria-label="Reset after"></div>
    </section>

    <section id="tab-section" class="panel">
      <h2>This tab <span id="tab-site" class="subtle"></span></h2>
      <div id="tab-hosts" class="hosts"></div>
      <div id="tab-actions" class="actions"></div>
      <div id="tab-allows" class="grants"></div>
      <p id="tab-note" class="note"></p>
    </section>

    <section id="device-section" class="panel">
      <h2>This device</h2>
      <div id="device-state" class="state"></div>
      <button id="device-button" type="button" class="btn btn-primary wide">
        Unfilter this device
      </button>
      <p id="device-note" class="note"></p>
    </section>

    <section class="panel">
      <h2>Whole network</h2>
      <div id="network-state" class="state"></div>
      <button id="network-button" type="button" class="btn btn-danger wide">
        Turn blocking off
      </button>
      <p id="network-note" class="note"></p>
    </section>

    <footer class="foot">
      <a id="options-link" href="#">Options</a>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
